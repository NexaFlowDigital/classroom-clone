<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Classroom Screen Clone</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="screenTabs"></div>
  <div id="canvas"></div>
  <div id="toolbar">
    <button id="collapseBtn" title="Hide toolbar">▲</button>
    <div id="tools">
      <select id="widgetSelect" title="Add widget…">
        <option value="">➕ Add widget…</option>
        <!-- Widget options populated dynamically -->
      </select>
      <button id="selectTool" title="Select widget">🔲</button>
      <button id="annotateTool" title="Annotate canvas">✏️</button>
      <button id="undoBtn" title="Undo annotation">↶</button>
      <button id="exportBtn" title="Export screen state">⬇️ Export</button>
      <button id="importBtn" title="Import screen state">⬆️ Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none"/>
      <button id="settingsBtn" title="Global settings">⚙️</button>
    </div>
  </div>

  <div id="annoControls">
    <button id="penBtn" title="Pen tool">✏️</button>
    <input type="color" id="penColor" title="Pen color" value="#FF0000"/>
    <input type="range" id="penSize" title="Pen size" min="1" max="20" value="4"/>
    <button id="eraserBtn" title="Eraser tool">🧹</button>
  </div>

  <div id="settingsPanel" class="hidden">
    <h3>Theme Settings</h3>
    <label>Toolbar bg: <input type="color" id="themeToolbar" value="#FDEBD0"/></label>
    <label>Widget header bg: <input type="color" id="themeWidget" value="#A9DFBF"/></label>
    <label>Canvas bg: <input type="color" id="canvasBg" value="#ffffff"/></label>
    <button id="closeSettings">Close</button>
  </div>

  <div id="widgetSettingsPanel" class="hidden"></div>

  <script src="script.js"></script>
</body>
</html>
