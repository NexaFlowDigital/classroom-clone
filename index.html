<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Classroom Screen Clone</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="canvas"></div>

  <!-- Bottom‐center toolbar -->
  <div id="toolbar">
    <button id="collapseBtn" title="Hide toolbar">▲</button>
    <div id="tools">
      <select id="widgetSelect" title="Add widget">
        <option value="">➕ Add widget…</option>
        <option value="screenShare">Screen Share</option>
        <option value="setBackground">Background</option>
        <option value="text">Text</option>
        <option value="clock">Clock</option>
        <option value="timer">Timer</option>
        <option value="visualTimer">Visual Timer</option>
        <option value="eventCountdown">Countdown</option>
        <option value="poll">Poll</option>
        <option value="timetable">Timetable</option>
        <option value="randomizer">Randomizer</option>
        <option value="groupMaker">Group Maker</option>
        <option value="dice">Dice</option>
        <option value="trafficLight">Traffic Light</option>
        <option value="scoreboard">Scoreboard</option>
        <option value="soundLevel">Sound Level</option>
        <option value="workSymbols">Work Symbols</option>
        <option value="stickers">Stickers</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="embed">Embed</option>
        <option value="hyperlink">Hyperlink</option>
        <option value="restroom">Rest Room</option>
      </select>
      <button id="selectTool" title="Select widgets">🔲</button>
      <button id="annotateTool" title="Draw on canvas">✏️</button>
      <button id="undoBtn" title="Undo drawing">↶</button>
      <button id="saveBtn" title="Save layout">💾</button>
      <button id="settingsBtn" title="Settings ⚙️">⚙️</button>
    </div>
  </div>

  <!-- Annotation controls -->
  <div id="annoControls">
    <button id="penBtn" title="Pen">✏️</button>
    <label><input type="color" id="penColor" value="#e74c3c"/> Color</label>
    <label><input type="range" id="penSize" min="1" max="20" value="4"/> Size</label>
    <button id="eraserBtn" title="Eraser">🧹</button>
  </div>

  <!-- Settings panel -->
  <div id="settingsPanel">
    <h3>Theme Settings</h3>
    <label>Toolbar bg: <input type="color" id="themeToolbar"/></label>
    <label>Widget header bg: <input type="color" id="themeWidget"/></label>
    <button id="closeSettings">Close</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
