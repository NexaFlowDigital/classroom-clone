<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classroom Screen Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Screen Tabs -->
  <div id="screenTabs"></div>

  <!-- Main Canvas -->
  <div id="canvas"></div>

  <!-- Toolbar -->
  <div id="toolbar">
    <select id="widgetSelect">
      <option value="">➕ Add widget…</option>
      <optgroup label="Core">
        <option value="text">Text</option>
        <option value="clock">Clock</option>
        <option value="timer">Timer</option>
        <option value="visualTimer">Visual Timer</option>
      </optgroup>
      <optgroup label="Interactive">
        <option value="poll">Poll</option>
        <option value="timetable">Timetable</option>
        <option value="randomizer">Randomizer</option>
        <option value="groupMaker">Group Maker</option>
        <option value="dice">Dice</option>
        <option value="trafficLight">Traffic Light</option>
        <option value="scoreboard">Scoreboard</option>
        <option value="soundLevel">Sound Level</option>
        <option value="workSymbols">Work Symbols</option>
        <option value="stickers">Stickers</option>
        <option value="restroom">Restroom</option>
      </optgroup>
      <optgroup label="Media & Tools">
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="embed">Embed</option>
        <option value="hyperlink">Hyperlink</option>
        <option value="qrCode">QR Code</option>
        <option value="stopwatch">Stopwatch</option>
        <option value="draw">Draw</option>
        <option value="webcam">Webcam</option>
        <option value="calendar">Calendar</option>
        <option value="screenShare">Screen Share</option>
        <option value="eventCountdown">Countdown</option>
      </optgroup>
    </select>
    <button id="annotateTool">✏️ Annotate</button>
  </div>

  <!-- In-canvas Annotation Controls -->
  <div id="annoControls" style="display:none; position:fixed; bottom:50px; left:50%; transform:translateX(-50%); z-index:1000;">
    <button id="penBtn">✏️</button>
    <input type="color" id="penColor" value="#ff0000" />
    <input type="range" id="penSize" min="1" max="20" value="4" />
    <button id="eraserBtn">🧹</button>
    <button id="undoBtn">↶</button>
  </div>

  <!-- Main logic -->
  <script type="module" src="main.js"></script>
</body>
</html>
